<style>

:root[data-theme=dark]{--bg:#000;--card:#1c1c1e;--tx:#f2f2f7;--sub:#8e8e93;--ac:#4da3ff;--in:#4cd964;--out:#ff6b5e;--ln:#38383a;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"Hiragino Sans",sans-serif;padding-bottom:84px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 14px 6px;z-index:5}
.bal{font-size:13px;color:var(--sub)}.big{font-size:30px;font-weight:700}
.nav{display:flex;align-items:center;justify-content:space-between;margin:6px 0}.nav b{font-size:18px}
button{font:inherit;color:var(--ac);background:none;border:0;padding:8px 12px}
.sum{display:flex;gap:8px}.sum div{flex:1;background:var(--card);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--sub)}.sum span{display:block;font-size:16px;font-weight:600;color:var(--tx)}
.list{margin:8px 14px;background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;justify-content:space-between;gap:8px;padding:11px 14px;border-bottom:1px solid var(--ln)}.row:last-child{border:0}
.row .g{font-size:15px;word-break:break-all}.row .s{font-size:12px;color:var(--sub)}.r{text-align:right;white-space:nowrap}.in{color:var(--in)}.out{color:var(--out)}
.age{margin:8px 20px 0;font-size:12px;color:var(--sub)}.plan{opacity:.6}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}.tabs button{flex:1;padding:12px}.tabs .on{font-weight:700}
.fab{position:fixed;right:16px;bottom:calc(70px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:26px;background:var(--ac);color:#fff;font-size:28px;padding:0;box-shadow:0 2px 8px #0004}
dialog{width:100%;max-width:560px;margin:auto auto 0;border:0;border-radius:16px 16px 0 0;background:var(--bg);color:var(--tx);padding:14px;max-height:92vh;overflow:auto}
dialog::backdrop{background:#0006}
label{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--ln)}
label input{width:55%;text-align:right;border:0;background:none;color:var(--tx);font:inherit;min-width:0}
h4{margin:14px 4px 4px;color:var(--sub);font-size:12px}.btns{display:flex;justify-content:space-between;margin-top:12px}
.months .row{cursor:pointer}.bar{height:6px;background:var(--ac);border-radius:3px;margin-top:4px}
.set{margin:14px}.set button{display:block;width:100%;background:var(--card);border-radius:10px;margin-bottom:8px;text-align:left}.hint{font-size:12px;color:var(--sub);margin:8px 4px}

function edit(i){const isNew=i<0;const r=isNew?{y:cur0().y,m:cur0().m,d:0,e:0,g:'',c:{},auto:1}:rows[i];const dlg=$('dlg');
 const gs=[...new Set(CATS.map(c=>c[2]))];
 dlg.innerHTML=`<b>${isNew?'明細を追加':'明細を編集'}（${r.y}年${r.m}月）</b><h4>基本</h4>
 <label>備考<input id="fg" value="${esc(r.g||'')}"></label><label>収入<input id="fd" type="number" inputmode="numeric" value="${r.d||''}"></label><label>支出<input id="fe" type="number" inputmode="numeric" value="${r.e||''}"></label>
 <label>支出を自動計算<input id="fa" type="checkbox" style="width:auto" ${r.ef||r.auto?'checked':''}></label><div class="hint">${r.ef?'Excelの計算式：='+esc(r.ef)+'（行番号はExcelのシート行）':'自動計算＝内訳の合計（積立項目 U〜AB列は含みません）'}</div>
 <details><summary style="margin-top:12px;color:var(--ac)">内訳（経費・積立・税金・社会保険料）</summary>`+gs.map(g=>`<h4>${g}</h4>`+CATS.filter(c=>c[2]===g).map(c=>`<label>${esc(c[1])}<input data-c="${c[0]}" type="number" inputmode="numeric" value="${(r.c||{})[c[0]]||''}"></label>`).join('')).join('')+`</details>
 <details><summary style="margin-top:12px;color:var(--ac)">積立からの支払（この行の支出のうち）</summary>`+TC.map(c=>`<label>${esc(CATS.find(z=>z[0]===c)[1])}<input data-p="${c}" type="number" inputmode="numeric" value="${(isNew?0:PV[i][c])||''}"></label>`).join('')+`</details>
 <div class="btns"><button id="x">キャンセル</button>${isNew?'':'<button id="dl" style="color:var(--out)">削除</button>'}<button id="ok"><b>保存</b></button></div>`;
 $('x').onclick=()=>dlg.close();const fa=$('fa'),fe=$('fe');fa.onchange=()=>{fe.disabled=fa.checked};fe.disabled=fa.checked;
 if(!isNew)$('dl').onclick=()=>{if(confirm('この行を削除しますか？')){rows.splice(i,1);recalc();persist();dlg.close();render()}};
 $('ok').onclick=()=>{r.g=$('fg').value;r.d=+$('fd').value||0;r.c={};if(fa.checked){if(!r.ef)r.auto=1}else{delete r.ef;delete r.auto;r.e=+fe.value||0}dlg.querySelectorAll('[data-c]').forEach(x=>{if(+x.value)r.c[x.dataset.c]=+x.value});
  dlg.querySelectorAll('[data-p]').forEach(x=>{const c=x.dataset.p,v=+x.value||0,old=(isNew?0:PV[i][c])||0;if(v!==old){r.pay=r.pay||{};if(v)r.pay[c]=v;else delete r.pay[c]}});
  if(isNew){r.id=Math.max(...rows.map(x=>x.id))+1;const M=months().find(x=>x.k===cur);rows.splice(M.idx[M.idx.length-1]+1,0,r)}
  recalc();persist();dlg.close();render()};dlg.showModal()}
function cur0(){return months().find(x=>x.k===cur)}
$('fab').onclick=()=>edit(-1);
$('pv').onclick=()=>{const M=months(),i=M.findIndex(x=>x.k===cur);if(i>0){cur=M[i-1].k;render()}};
$('nx').onclick=()=>{const M=months(),i=M.findIndex(x=>x.k===cur);if(i<M.length-1){cur=M[i+1].k;render()}};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();scrollTo(0,0)});
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.v===4&&Array.isArray(s.rows)&&s.rows.length&&s.rows[0].id){rows=s.rows;OPEN=s.open||{}}}catch(e){}
recalc();render();
(async()=>{try{const [db,u]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!u)return;const id=await u.id();if(!id)return;
 dbRef=db.doc('data/users/'+id+'/ledger');const s=await dbRef.get();
 if(s.exists&&s.data().ver===4){const a=JSON.parse(s.data().rows);if(Array.isArray(a)&&a.length&&a[0].id){rows=a;try{OPEN=JSON.parse(s.data().open||'{}')}catch(e){}recalc();try{localStorage.setItem(KEY,JSON.stringify({v:4,rows,open:OPEN}))}catch(e){}render()}}
 else{await dbRef.set({rows:JSON.stringify(rows),open:JSON.stringify(OPEN),ver:4,at:Date.now()})}}catch(e){console.error(e)}})();
</script></body></html>
