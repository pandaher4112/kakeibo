<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="おさいふポーチ">
<meta name="theme-color" content="#ffe3ee"><title>おさいふポーチ</title>
<style>
:root{--bg:#fff3f8;--bg2:#eaf4ff;--card:#ffffffd9;--tx:#4d3a49;--sub:#a58a9f;--sh:#e7a9c655;--ln:#f3d6e4;--icbg:#fff;--pill:#ffe0ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241a27;--bg2:#161a2a;--card:#2f2434d9;--tx:#f8e9f1;--sub:#b99db3;--sh:#0006;--ln:#47374d;--icbg:#3a2d40;--pill:#4a3552;color-scheme:dark}
:root:not([data-theme="light"]) .app{background:linear-gradient(135deg,var(--d1),var(--d2))}}
:root[data-theme="dark"]{--bg:#241a27;--bg2:#161a2a;--card:#2f2434d9;--tx:#f8e9f1;--sub:#b99db3;--sh:#0006;--ln:#47374d;--icbg:#3a2d40;--pill:#4a3552;color-scheme:dark}
:root[data-theme="dark"] .app{background:linear-gradient(135deg,var(--d1),var(--d2))}
*{box-sizing:border-box}html{height:100%}
body{margin:0;min-height:100%;background:linear-gradient(170deg,var(--bg),var(--bg2));background-attachment:fixed;color:var(--tx);font:16px/1.5 -apple-system,"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(40px);opacity:.55;z-index:0;pointer-events:none}
.b1{width:220px;height:220px;background:#ffc6dd;top:-60px;right:-60px}.b2{width:200px;height:200px;background:#c8e2ff;bottom:60px;left:-70px}.b3{width:150px;height:150px;background:#d9f5e3;top:46%;right:-50px}
#home{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:22px 18px 40px}
.hero{display:flex;align-items:center;gap:14px}
.mascot{font-size:56px;line-height:1;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 6px 8px var(--sh))}
.th{margin-left:auto;align-self:flex-start;width:42px;height:42px;border-radius:50%;border:0;background:var(--card);box-shadow:0 4px 10px var(--sh);font-size:20px;padding:0;cursor:pointer}
.hi{font-size:24px;font-weight:800;letter-spacing:.02em}.dt{font-size:13px;color:var(--sub)}
.bubble{position:relative;margin:16px 0 22px 6px;padding:12px 16px;background:var(--card);border-radius:20px;box-shadow:0 6px 16px var(--sh);font-size:14px}
.bubble:before{content:"";position:absolute;top:-8px;left:26px;border:8px solid transparent;border-top:0;border-bottom-color:var(--card)}
.apps{display:grid;gap:14px}
.app{display:flex;align-items:center;gap:14px;padding:16px;border-radius:28px;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 10px 22px var(--sh);color:var(--tx);text-decoration:none;transition:transform .18s cubic-bezier(.3,1.6,.5,1);position:relative;overflow:hidden}
.app:active{transform:scale(.95) rotate(-1.2deg)}
.app:after{content:attr(data-s);position:absolute;right:12px;top:6px;font-size:16px;opacity:.7}
.ic{flex:none;width:66px;height:66px;border-radius:23px;background:var(--icbg);display:grid;place-items:center;font-size:36px;box-shadow:0 5px 12px #0001,inset 0 -4px 0 #0000000d}
.nm{font-weight:800;font-size:18px}.ds{font-size:12.5px;color:var(--sub)}
.go{margin-left:auto;font-size:22px;opacity:.45;padding-right:6px}
.tip{margin-top:26px;text-align:center;font-size:12px;color:var(--sub)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-7px) rotate(3deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i>
<main id="home">
 <div class="hero"><div class="mascot">🐰</div><div><div class="hi" id="hi"></div><div class="dt" id="dt"></div></div><button class="th" id="th" aria-label="明るさ切り替え"></button></div>
 <div class="bubble" id="msg"></div>
 <section class="apps">
  <a class="app" href="#" data-k="bank" target="_blank" rel="noopener" data-s="✨" style="--g1:#d6eaff;--g2:#f0f7ff;--d1:#2b3a56;--d2:#222d44"><div class="ic">🏦</div><div><div class="nm">銀行残高確認</div><div class="ds">残高・積立をチェック</div></div><div class="go">›</div></a>
  <a class="app" href="#" data-k="kakeibo" target="_blank" rel="noopener" data-s="🌿" style="--g1:#d3f3e2;--g2:#f0fbf5;--d1:#25423a;--d2:#1f3530"><div class="ic">🏡</div><div><div class="nm">わが家の家計簿</div><div class="ds">毎日の収支をつけよう</div></div><div class="go">›</div></a>
  <a class="app" href="#" data-k="point" target="_blank" rel="noopener" data-s="🎀" style="--g1:#ffd8ea;--g2:#fff0f7;--d1:#4d2c42;--d2:#3b2536"><div class="ic">🪙</div><div><div class="nm">MUFGポイント管理</div><div class="ds">ポイントをこつこつ貯めよう</div></div><div class="go">›</div></a>
   <a class="app" href="#" data-k="asset" target="_blank" rel="noopener" data-s="🍀" style="--g1:#e4dcfa;--g2:#f6f1ff;--d1:#3a3158;--d2:#2d2646"><div class="ic">💎</div><div><div class="nm">資産管理</div><div class="ds">資産のようすを見守ろう</div></div><div class="go">›</div></a>
 </section>
 <div class="tip">タップすると、新しいタブで開きます 🌸　（ホーム画面に追加しておくと便利です）</div>
</main>
<script>
const URLS={bank:'https://pandaher4112.github.io/kakeibo/bank.html',kakeibo:'https://pandaher4112.github.io/kakeibo/kakeibo.html',point:'https://pandaher4112.github.io/kakeibo/point.html',asset:'https://pandaher4112.github.io/kakeibo/shisan.html'};
document.querySelectorAll('.app').forEach(a=>a.href=URLS[a.dataset.k]);
const MSG=['今日もおつかれさま ♡','ちりも積もればおさいふふっくら 🌸','お買い物の前に残高チェックしよう 🐰','ポイントもこつこつ貯めよう ✨','自分へのごほうびも、たまにはね 🍓','きょうも1日ゆるっといこう ☁️','ちゃんと記録できてえらい！ 🎀'];
const $=id=>document.getElementById(id);
(function(){const d=new Date(),h=d.getHours();
 $('hi').textContent=h<5?'まだ起きてる？ 🌙':h<11?'おはよう ☀️':h<17?'こんにちは 🌸':'こんばんは 🌙';
 $('dt').textContent=`${d.getMonth()+1}月${d.getDate()}日（${'日月火水木金土'[d.getDay()]}）`;
 $('msg').textContent=MSG[(d.getDate()+d.getMonth())%MSG.length]})();
let TH='light';try{TH=localStorage.getItem('pouch-theme')||'light'}catch(e){}
function applyTheme(){const r=document.documentElement;TH==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',TH);
 $('th').textContent=TH==='light'?'☀️':TH==='dark'?'🌙':'🌗'}
$('th').onclick=()=>{TH=TH==='light'?'dark':TH==='dark'?'auto':'light';try{localStorage.setItem('pouch-theme',TH)}catch(e){}applyTheme()};
applyTheme();
</script></body></html>
