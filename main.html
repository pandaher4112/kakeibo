ex:1;pointer-events:auto}.managegroup button,.managecat button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}.confirmback{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:24px;z-index:20}.confirmback.open{display:flex}.confirmbox{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:340px;box-shadow:0 10px 35px #0003}.confirmbox h3{margin:0 0 8px;font-size:17px}.confirmbox p{font-size:13px;color:var(--muted);line-height:1.5}.confirmactions{display:flex;gap:8px;margin-top:16px}.confirmactions button{flex:1}@media(max-width:420px){.twocol{grid-template-columns:1fr}}\n.linklike{border:0;background:none;padding:0;color:var(--green);font:inherit;text-align:left;text-decoration:underline;cursor:pointer}\n<\/style><\/head><body>\n<header><div class=\"top\"><h1>🏡 わが家の家計簿<\/h1><span style=\"font-size:11px;opacity:.85\">毎月つづける家計管理<\/span><\/div><div class=\"monthbar\"><button id=\"prev\">‹<\/button><input id=\"month\" type=\"month\"><button id=\"next\">›<\/button><\/div><\/header>\n<main>\n<section id=\"home\">\n<div class=\"panel\"><div class=\"sectionhead\"><h2>今月の収支<\/h2><span class=\"muted\" id=\"count\"><\/span><\/div><div class=\"summary\"><div class=\"tile\"><span class=\"label\">収入<\/span><strong id=\"income\">¥0<\/strong><\/div><div class=\"tile out\"><span class=\"label\">支出<\/span><strong id=\"expense\">¥0<\/strong><\/div><div class=\"tile balance\"><span class=\"label\">収支<\/span><strong id=\"net\">¥0<\/strong><\/div><div class=\"tile\"><span class=\"label\">予算残額（予算 − 支出実績）<\/span><strong id=\"remain\">¥0<\/strong><\/div><\/div><\/div>\n<div class=\"panel\"><div class=\"sectionhead\"><h2>最近の記録<\/h2><button class=\"btn light\" onclick=\"show('history')\">すべて見る<\/button><\/div><div id=\"recent\"><\/div><\/div>\n<div class=\"panel\"><div class=\"sectionhead\"><h2>大項目別 集計<\/h2><span class=\"muted\">今月<\/span><\/div><div class=\"twocol\"><div><h3 class=\"minihead income\">収入<\/h3><div id=\"incomeCats\"><\/div><\/div><div><h3 class=\"minihead expense\">支出<\/h3><div id=\"expenseCats\"><\/div><\/div><\/div><\/div>\n<div class=\"panel\"><div class=\"sectionhead\"><h2>銀行・支払方法別 支出集計<\/h2><span class=\"muted\">今月<\/span><\/div><div class=\"tile out\" style=\"margin-bottom:10px\"><span class=\"label\">未払い合計<\/span><strong id=\"bankGrandTotal\">¥0<\/strong><\/div><div class=\"stathead\" style=\"grid-template-columns:minmax(0,1fr) auto\"><span>銀行・支払方法<\/span><span class=\"statnum\">未払い額<\/span><\/div><div id=\"bankSummary\"><\/div><p class=\"note\">履歴で「支払い済み」にチェックしていない支出だけを集計します。<\/p><\/div>\n<div class=\"panel\"><div class=\"sectionhead\"><h2>引落口座別 集計<\/h2><span class=\"muted\">今月・未払い<\/span><\/div><div class=\"tile out\" style=\"margin-bottom:10px\"><span class=\"label\">引落口座別 未払い合計<\/span><strong id=\"accountGrandTotal\">¥0<\/strong><\/div><div id=\"withdrawalAccountSummary\"><\/div><p class=\"note\">支払方法の管理設定で紐づけた引落口座ごとの未払い支出です。口座名を押すと履歴を絞り込みます。<\/p><\/div>\n<div class=\"panel\"><div class=\"sectionhead\"><h2>支払日別 集計<\/h2><span class=\"muted\">銀行・支払方法別<\/span><\/div><div class=\"tile out\" style=\"margin-bottom:10px\"><span class=\"label\">未払い合計<\/span><strong id=\"paymentGrandTotal\">¥0<\/strong><\/div><div id=\"paymentDates\"><\/div><p class=\"note\">月度は毎月15日〜翌月14日です。引落日1〜14日は翌月、15〜31日は選択月の日付として、日付の下に支払方法ごとの項目を表示します。項目を押すと内訳を開閉できます。引落日が未登録の場合は取引の日付を使用します。<\/p><\/div>\n<\/section>\n<section id=\"add\" class=\"hidden\"><div class=\"panel\"><h2 style=\"font-size:17px;margin:0 0 8px\">取引を入力<\/h2><div class=\"formgrid\">\n<div><label>区分<\/label><select id=\"type\"><option value=\"expense\">支出<\/option><option value=\"income\">収入<\/option><\/select><\/div><div><label>日付<\/label><input type=\"date\" id=\"date\"><\/div>\n<div><label>大項目<\/label><select id=\"majorCategory\"><\/select><\/div><div><label>費目<\/label><select id=\"category\"><\/select><\/div><div><label>金額（円）<\/label><input type=\"number\" id=\"amount\" inputmode=\"numeric\" placeholder=\"例：1000 または -1000\" step=\"1\"><\/div>\n<div><label>支払方法・口座<\/label><select id=\"method\"><option value=\"\">選択してください<\/option><\/select><\/div><div><label>月の引落日（毎月）<\/label><input id=\"paymentDay\" type=\"number\" inputmode=\"numeric\" min=\"1\" max=\"31\" placeholder=\"例：27\"><\/div><div class=\"full\"><label>店名・メモ<\/label><input id=\"memo\" placeholder=\"任意\"><\/div>\n<\/div><label style=\"display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:var(--ink)\"><input type=\"checkbox\" id=\"paidflag\" style=\"width:auto\">支払い済み<\/label><label style=\"display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--ink)\"><input type=\"checkbox\" id=\"confirmedflag\" style=\"width:auto\">確認済み<\/label><label style=\"display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--ink)\"><input type=\"checkbox\" id=\"carryflag\" style=\"width:auto\">この項目を翌月への引継ぎ対象にする<\/label><button class=\"btn\" style=\"width:100%;margin-top:16px\" id=\"save\">記録する<\/button><button class=\"btn light hidden\" style=\"width:100%;margin-top:9px\" id=\"canceledit\">編集をキャンセル<\/button><button class=\"btn light\" style=\"width:100%;margin-top:9px\" id=\"importprev\">前月のチェック済み項目を引き継ぐ<\/button><p class=\"note\">引継ぎ対象にチェックした項目だけ、翌月の入力欄へコピーできます。日付は未設定で引き継ぎます。登録した内容はこのiPhoneのブラウザ内に保存されます。<\/p><\/div><\/section>\n<section id=\"history\" class=\"hidden\"><div class=\"panel\"><div class=\"sectionhead\"><h2>取引履歴<\/h2><span class=\"muted\" id=\"historytotal\"><\/span><\/div><input class=\"search\" id=\"filter\" placeholder=\"費目・店名・支払方法で検索\"><div id=\"historyfilter\" class=\"note\" style=\"display:none;margin:8px 0\"><\/div><div id=\"list\"><\/div><\/div><\/section>\n<section id=\"budget\" class=\"hidden\"><div class=\"panel\"><div class=\"sectionhead\"><h2>予算管理<\/h2><button class=\"btn light\" id=\"addbudget\">＋費目の予算<\/button><\/div><p class=\"note\">管理画面で登録した「大項目・費目」の構成に合わせて予算を管理します。大項目ごとに費目を表示し、金額をタップして月予算を変更できます。新しい費目の予算を設定する場合は、先に管理画面で費目を登録してください。<\/p><div class=\"summary\" id=\"budgetTotals\"><div class=\"tile\"><span class=\"label\">予算額 合計<\/span><strong id=\"budgetTotal\">¥0<\/strong><\/div><div class=\"tile out\"><span class=\"label\">支出実績 合計<\/span><strong id=\"budgetActualTotal\">¥0<\/strong><\/div><div class=\"tile balance\" style=\"grid-column:1/-1\"><span class=\"label\">予算残額（予算額 − 支出実績）<\/span><strong id=\"budgetRemaining\">¥0<\/strong><\/div><\/div><p class=\"note\">ホームの「予算残額」も、予算額から支出実績を差し引いた金額です。プラスなら予算内、マイナスなら予算超過です。<\/p><div id=\"budgets\"><\/div><\/div><\/section>\n<section id=\"accounts\" class=\"hidden\"><div class=\"panel\"><div class=\"sectionhead\"><h2>口座・残高メモ<\/h2><button class=\"btn light\" id=\"addaccount\">＋口座<\/button><\/div><div id=\"accountlist\"><\/div><p class=\"note\">口座残高は月ごとに記録できます。取引から自動で銀行残高を照合する機能ではなく、残高確認用のメモです。<\/p><\/div>\n<\/section>\n<section id=\"manage\" class=\"hidden\"><div class=\"panel\"><h2 style=\"font-size:16px;margin:0 0 10px\">データのバックアップ<\/h2><div class=\"actions\"><button class=\"btn\" id=\"backup\">バックアップを書き出す<\/button><label class=\"btn light\" style=\"margin:0;cursor:pointer\">バックアップを復元<input type=\"file\" id=\"restore\" accept=\".json,application/json\" hidden><\/label><\/div><p class=\"note\">機種変更・Safariのデータ消去に備え、定期的にバックアップを保存してください。<\/p><\/div><div class=\"panel\"><div class=\"sectionhead\"><h2>支払方法・引落日の管理<\/h2><button class=\"btn\" id=\"addPaymentMethod\">＋支払方法<\/button><\/div><p class=\"note\">支払方法ごとに引落口座と毎月の引落日（1〜31日）を設定します。ここで登録した引落口座・引落日をホームの集計に使用します。<\/p><div id=\"paymentMethodManager\"><\/div><\/div><div class=\"panel\"><div class=\"sectionhead\"><h2>費目・大項目の管理<\/h2><button class=\"btn\" id=\"addMajor\">＋大項目<\/button><\/div><p class=\"note\">大項目の下に費目を登録します。名称変更は過去の取引・予算にも反映されます。使用中の費目は削除できません。<\/p><div id=\"categoryManager\"><\/div><\/div><\/section>\n<\/main>\n<nav class=\"tabs\"><button class=\"active\" data-tab=\"home\"><b>⌂<\/b>ホーム<\/button><button data-tab=\"add\"><b>＋<\/b>入力<\/button><button data-tab=\"history\"><b>▤<\/b>履歴<\/button><button data-tab=\"budget\"><b>◫<\/b>予算<\/button><button data-tab=\"accounts\"><b>▣<\/b>口座<\/button><button data-tab=\"manage\"><b>⚙<\/b>管理<\/button><\/nav>\n<div id=\"deleteConfirm\" class=\"confirmback\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"deleteTitle\"><div class=\"confirmbox\"><h3 id=\"deleteTitle\">この記録を削除しますか？<\/h3><p>削除した記録は元に戻せません。<\/p><div class=\"confirmactions\"><button type=\"button\" class=\"btn light\" id=\"cancelDelete\">キャンセル<\/button><button type=\"button\" class=\"btn red\" id=\"confirmDelete\">削除する<\/button><\/div><\/div><\/div>\n<script>\nconst INITIAL={\"month\": \"2026-11\", \"transactions\": [{\"id\": \"import-11\", \"date\": \"\", \"type\": \"income\", \"category\": \"返金・調整\", \"amount\": 7176, \"method\": \"MUFGカード\", \"memo\": \"元シートのマイナス計上分\"}, {\"id\": \"import-13\", \"date\": \"2035-10-26\", \"type\": \"expense\", \"category\": \"住宅ローン\", \"amount\": 156748, \"method\": \"横浜銀行\", \"memo\": \"\"}, {\"id\": \"import-14\", \"date\": \"2028-09-01\", \"type\": \"expense\", \"category\": \"備品\", \"amount\": 9900, \"method\": \"三菱u銀行\", \"memo\": \"バイク\"}, {\"id\": \"import-15\", \"date\": \"2034-01-27\", \"type\": \"expense\", \"category\": \"補繕費\", \"amount\": 16707, \"method\": \"Jacss\", \"memo\": \"蓄電池\"}, {\"id\": \"import-16\", \"date\": \"2031-09-27\", \"type\": \"expense\", \"category\": \"補繕費\", \"amount\": 7700, \"method\": \"Jacss\", \"memo\": \"カーペット代\"}, {\"id\": \"import-17\", \"date\": \"2032-02-27\", \"type\": \"expense\", \"category\": \"補繕費\", \"amount\": 22195, \"method\": \"オリコ\", \"memo\": \"屋根・外壁塗装\"}, {\"id\": \"import-18\", \"date\": \"2029-02-26\", \"type\": \"expense\", \"category\": \"趣味\", \"amount\": 9900, \"method\": \"三菱u銀行\", \"memo\": \"パソコン（ソラ）\"}, {\"id\": \"import-19\", \"date\": \"2028-10-26\", \"type\": \"expense\", \"category\": \"補繕費\", \"amount\": 3600, \"method\": \"三菱u銀行\", \"memo\": \"エアコン\"}, {\"id\": \"import-20\", \"date\": \"\", \"type\": \"expense\", \"category\": \"大 ment.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab))}\ndocument.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.tab));\nfunction resetTxForm(){editingTxId=null;['amount','method','memo','paymentDay'].forEach(id=>document.getElementById(id).value='');refreshCategorySelect('住居・光熱費','');document.getElementById('carryflag').checked=false;document.getElementById('paidflag').checked=false;document.getElementById('confirmedflag').checked=false;document.getElementById('type').value='expense';document.getElementById('date').value=new Date().toISOString().slice(0,10);document.getElementById('save').textContent='記録する';document.getElementById('canceledit').classList.add('hidden')}\nfunction editTx(id){let tx=data().transactions.find(x=>x.id===id);if(!tx)return;editingTxId=id;document.getElementById('type').value=tx.type;document.getElementById('date').value=tx.date||'';refreshCategorySelect(categoryMajor(tx.category),tx.category);document.getElementById('amount').value=tx.amount;document.getElementById('method').value=tx.method||'';document.getElementById('paymentDay').value=tx.paymentDay||paymentMethod(tx.method||'')?.withdrawalDay||'';document.getElementById('memo').value=tx.memo||'';document.getElementById('carryflag').checked=!!tx.carryForward;document.getElementById('paidflag').checked=!!tx.paid;document.getElementById('confirmedflag').checked=!!tx.confirmed;document.getElementById('save').textContent='変更を保存';document.getElementById('canceledit').classList.remove('hidden');show('add')}\ndocument.getElementById('canceledit').onclick=()=>{resetTxForm();show('history')};\ndocument.getElementById('save').onclick=()=>{let amount=Number(document.getElementById('amount').value),category=document.getElementById('category').value.trim();if(!Number.isFinite(amount)||amount===0||!category){alert('費目と0以外の金額を入力してください');return}let values={type:document.getElementById('type').value,date:document.getElementById('date').value,category,amount,method:document.getElementById('method').value.trim(),paymentDay:(()=>{let n=Number(document.getElementById('paymentDay').value);return n>=1&&n<=31?n:null})(),memo:document.getElementById('memo').value.trim(),carryForward:document.getElementById('carryflag').checked,paid:document.getElementById('paidflag').checked,confirmed:document.getElementById('confirmedflag').checked};if(editingTxId){let tx=data().transactions.find(x=>x.id===editingTxId);if(tx){values.createdAt=tx.createdAt||Date.now();values.updatedAt=Date.now();Object.assign(tx,values)}}else{let now=Date.now();data().transactions.push({id:'t'+now,...values,createdAt:now,updatedAt:now})}resetTxForm();persist();show('add')};\ndocument.getElementById('majorCategory').onchange=()=>refreshCategorySelect(document.getElementById('majorCategory').value,'');\ndocument.getElementById('method').addEventListener('change',syncPaymentDay);document.getElementById('method').addEventListener('blur',syncPaymentDay);\ndocument.getElementById('type').onchange=()=>{if(document.getElementById('type').value==='income'&&(db.categoryGroups||[]).some(g=>g.name==='収入'))refreshCategorySelect('収入','収入');else if(document.getElementById('type').value==='expense'&&document.getElementById('majorCategory').value==='収入')refreshCategorySelect(db.categoryGroups.find(g=>g.name!=='収入')?.name||'','')};\nfunction toggleCarry(id,checked){let tx=data().transactions.find(x=>x.id===id);if(tx){tx.carryForward=checked;localStorage.setItem(KEY,JSON.stringify(db));render()}}\nfunction togglePaid(id,checked){let tx=data().transactions.find(x=>String(x.id)===String(id));if(tx){tx.paid=checked;localStorage.setItem(KEY,JSON.stringify(db));render()}}\nfunction toggleConfirmed(id,checked){let tx=data().transactions.find(x=>String(x.id)===String(id));if(tx){tx.confirmed=checked;tx.updatedAt=Date.now();localStorage.setItem(KEY,JSON.stringify(db));render()}}\nfunction previousMonthKey(){let [y,m]=current.split('-').map(Number),d=new Date(y,m-2,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}\ndocument.getElementById('importprev').onclick=()=>{let prevKey=previousMonthKey(),prev=db.months[prevKey];if(!prev){alert('前月（'+prevKey+'）のデータがありません');return}let selected=(prev.transactions||[]).filter(x=>x.carryForward===true);if(!selected.length){alert('前月に「翌月へ引き継ぐ」とチェックされた項目はありません。前月の履歴で引継ぎたい項目にチェックしてください。');return}let signature=x=>[x.type,x.category,Number(x.amount)||0,x.method||'',x.memo||''].join('|');let existing=new Set(data().transactions.map(signature));let fresh=selected.filter(x=>!existing.has(signature(x)));if(!fresh.length){alert('チェック済み項目はすでに今月に引き継がれています');return}if(!confirm(prevKey+'のチェック済み項目 '+fresh.length+'件を '+current+' に引き継ぎますか？'))return;fresh.forEach((x,i)=>{let now=Date.now()+i;data().transactions.push({...x,id:'carry-'+now,date:'',carryForward:true,paid:false,confirmed:false,createdAt:now,updatedAt:now})});persist();alert(fresh.length+'件を引き継ぎました。日付を必要に応じて入力してください。')};\nlet pendingDeleteId=null;\nfunction handleTransactionAction(e){const b=e.target.closest('button[data-action]');if(!b)return;e.preventDefault();const id=b.dataset.id;if(b.dataset.action==='edit')editTx(id);if(b.dataset.action==='delete'){pendingDeleteId=id;document.getElementById('deleteConfirm').classList.add('open')}}\ndocument.getElementById('list').addEventListener('click',handleTransactionAction);\ndocument.getElementById('recent').addEventListener('click',handleTransactionAction);\ndocument.getElementById('cancelDelete').onclick=()=>{pendingDeleteId=null;document.getElementById('deleteConfirm').classList.remove('open')};\ndocument.getElementById('confirmDelete').onclick=()=>{if(pendingDeleteId!==null){data().transactions=data().transactions.filter(x=>String(x.id)!==String(pendingDeleteId));pendingDeleteId=null;document.getElementById('deleteConfirm').classList.remove('open');persist()}};\nfunction removeTx(id){pendingDeleteId=id;document.getElementById('deleteConfirm').classList.add('open')}\nfunction editBudget(i){let b=data().budgets[i],v=prompt(categoryMajor(b.category)+' ＞ '+b.category+' の月予算（円）',b.budget);if(v!==null&&v.trim()!==''&&!isNaN(v)){b.budget=Math.max(0,Number(v));persist()}}\nfunction editAccount(i){let a=data().accounts[i],v=prompt(a.name+' の残高（円）',a.balance);if(v!==null&&v.trim()!==''&&!isNaN(v)){a.balance=Number(v);persist()}}\ndocument.getElementById('addbudget').onclick=()=>{let available=(db.categoryGroups||[]).filter(g=>g.name!=='収入').flatMap(g=>(g.categories||[]).filter(cat=>!data().budgets.some(b=>b.category===cat)).map(cat=>({major:g.name,category:cat})));if(!available.length){alert('予算を設定できる費目がありません。先に管理画面で大項目・費目を追加してください。');return}let choices=available.map((x,i)=>`${i+1}. ${x.major} ＞ ${x.category}`).join('\\n');let selected=prompt('予算を設定する費目を番号で選択してください。\\n'+choices,'1');if(selected===null)return;let item=available[Number(selected)-1];if(!item){alert('正しい番号を入力してください');return}let v=prompt(item.major+' ＞ '+item.category+' の月予算（円）','0');if(v===null||v.trim()===''||isNaN(v)||Number(v)<0)return;data().budgets.push({category:item.category,budget:Number(v)});persist()};\ndocument.getElementById('addaccount').onclick=()=>{let n=prompt('口座名');if(!n)return;let v=Number(prompt('現在の残高（円）','0')||0);data().accounts.push({name:n,balance:v});persist()};\nfunction renderPaymentMethodManager(){const root=document.getElementById('paymentMethodManager');if(!root)return;root.innerHTML=(db.paymentMethods||[]).map((m,i)=>`<div class=\"rowitem\"><div><div class=\"name\">${esc(m.name)}<\/div><small>引落口座：${esc(m.withdrawalAccount||'未設定')} ・ 毎月 ${m.withdrawalDay?esc(m.withdrawalDay)+'日':'引落日未設定'}<\/small><\/div><div class=\"actions\"><button type=\"button\" class=\"btn light tiny\" onclick=\"editPaymentMethod(${i})\">変更<\/button><button type=\"button\" class=\"btn red tiny\" onclick=\"deletePaymentMethod(${i})\">削除<\/button><\/div><\/div>`).join('')||'<div class=\"empty\">支払方法が登録されていません<\/div>'}\nfunction savePaymentMethods(){localStorage.setItem(KEY,JSON.stringify(db));render()}\nfunction addPaymentMethod(){let name=prompt('支払方法・口座名（例：横浜銀行、楽天カード）');if(!name||!name.trim())return;name=name.trim();if(db.paymentMethods.some(x=>x.name===name)){alert('同じ支払方法が登録されています');return}let v=prompt('毎月の引落日（1〜31日）。未設定の場合は空欄','27');if(v===null)return;let day=v.trim()===''?null:Number(v);if(day!==null&&(!Number.isInteger(day)||day<1||day>31)){alert('引落日は1〜31で入力してください');return}let accounts=allAccountNames(),pick=prompt('引落口座の番号を入力してください（空欄で未設定）\\n'+accounts.map((a,i)=>(i+1)+'. '+a).join('\\n'),accounts.length?'1':'');if(pick===null)return;let account=pick.trim()===''?'':accounts[Number(pick)-1];if(pick.trim()!==''&&!account){alert('口座番号が正しくありません');return}db.paymentMethods.push({name,withdrawalDay:day,withdrawalAccount:account});savePaymentMethods()}\nfunction editPaymentMethod(i){let m=db.paymentMethods[i],name=prompt('支払方法・口座名',m.name);if(name===null||!name.trim())return;name=name.trim();if(db.paymentMethods.some((x,j)=>j!==i&&x.name===name)){alert('同じ支払方法が登録されています');return}let v=prompt('毎月の引落日（1〜31日）。未設定は空欄',m.withdrawalDay||'');if(v===null)return;let day=v.trim()===''?null:Number(v);if(day!==null&&(!Number.isInteger(day)||day<1||day>31)){alert('引落日は1〜31で入力してください');return}let accounts=allAccountNames(),currentAccount=m.withdrawalAccount||'',defaultPick=currentAccount?String(accounts.indexOf(currentAccount)+1):(accounts.length?'1':'');let pick=prompt('引落口座の番号を入力してください（空欄で未設定）\\n'+accounts.map((a,i)=>(i+1)+'. '+a).join('\\n'),defaultPick);if(pick===null)return;let account=pick.trim()===''?'':accounts[Number(pick)-1];if(pick.trim()!==''&&!account){alert('口座番号が正しくありません');return}let old=m.name,oldDay=m.withdrawalDay;m.name=name;m.withdrawalDay=day;m.withdrawalAccount=account;Object.values(db.months).forEach(mon=>(mon.transactions||[]).forEach(tx=>{if(tx.method===old){if(old!==name)tx.method=name;if(tx.paymentDay==null||Number(tx.paymentDay)===Number(oldDay))tx.paymentDay=day}}));savePaymentMethods()}\nfunction deletePaymentMethod(i){let m=db.paymentMethods[i],used=Object.values(db.months).some(mon=>(mon.transactions||[]).some(tx=>tx.method===m.name));if(used&&!confirm('この支払方法は取引履歴で使用中です。マスターから削除しますか？（過去の取引名は残ります）'))return;if(!used&&!confirm('「'+m.name+'」を削除しますか？'))return;db.paymentMethods.splice(i,1);savePaymentMethods()}\ndocument.getElementById('addPaymentMethod').addEventListener('click',addPaymentMethod);\nfunction renderCategoryManager(){\n const root=document.getElementById('categoryManager');if(!root)return;\n root.innerHTML=(db.categoryGroups||[]).map((g,gi)=>`<div class=\"managegroup\"><div class=\"managegrouphead\"><span>${esc(g.name)}<\/span><div class=\"actions\"><button type=\"button\" class=\"btn light tiny\" data-m-action=\"moveMajorUp\" data-gi=\"${gi}\" ${gi===0?'disabled':''}>↑<\/button><button type=\"button\" class=\"btn light tiny\" data-m-action=\"moveMajorDown\" data-gi=\"${gi}\" ${gi===db.categoryGroups.length-1?'disabled':''}>↓<\/button><button type=\"button\" class=\"btn light tiny\" data-m-action=\"renameMajor\" data-gi=\"${gi}\">名称変更<\/button><button type=\"button\" class=\"btn red tiny\" data-m-action=\"deleteMajor\" data-gi=\"${gi}\">削除<\/button><button type=\"button\" class=\"btn tiny\" data-m-action=\"addCategory\" data-gi=\"${gi}\">＋費目<\/button><\/div><\/div>${(g.categories||[]).map((c,ci)=>`<div class=\"managecat\"><span>${esc(c)}<\/span><div class=\"actions\"><button type=\"button\" class=\"btn light tiny\" data-m-action=\"renameCategory\" data-gi=\"${gi}\" data-ci=\"${ci}\">変更<\/button><button type=\"button\" class=\"btn light tiny\" data-m-action=\"moveCategory\" data-gi=\"${gi}\" data-ci=\"${ci}\">移動<\/button><button type=\"button\" class=\"btn red tiny\" data-m-action=\"deleteCategory\" data-gi=\"${gi}\" data-ci=\"${ci}\">削除<\/button><\/div><\/div>`).join('')||'<p class=\"note\">費目がありません<\/p>'}<\/div>`).join('')||'<div class=\"empty\">大項目がありません<\/div>';\n}\n// iPhone Safariでも確実に反応するよう、管理画面の操作はイベント委譲で処理\nconst categoryManagerRoot=document.getElementById('categoryManager');\ncategoryManagerRoot.addEventListener('click',function(e){\n const button=e.target.closest('button[data-m-action]');\n if(!button)return;\n e.preventDefault();e.stopPropagation();\n const gi=Number(button.dataset.gi),ci=Number(button.dataset.ci),action=button.dataset.mAction;\n if(action==='moveMajorUp')moveMajor(gi,-1);\n else if(action==='moveMajorDown')moveMajor(gi,1);\n else if(action==='renameMajor')renameMajor(gi);\n else if(action==='deleteMajor')deleteMajor(gi);\n else if(action==='addCategory')addCategory(gi);\n else if(action==='renameCategory')renameCategory(gi,ci);\n else if(action==='moveCategory')moveCategory(gi,ci);\n else if(action==='deleteCategory')deleteCategory(gi,ci);\n});\nfunction saveCategorySettings(){localStorage.setItem(KEY,JSON.stringify(db));render()}\nfunction addMajor(){let name=prompt('追加する大項目名');if(!name||!name.trim())return;name=name.trim();if(db.categoryGroups.some(g=>g.name===name)){alert('同じ大項目名があります');return}db.categoryGroups.push({name,categories:[]});saveCategorySettings()}\nfunction renameMajor(i){let g=db.categoryGroups[i],name=prompt('大項目名を変更',g.name);if(!name||!name.trim()||name.trim()===g.name)return;name=name.trim();if(db.categoryGroups.some((x,j)=>j!==i&&x.name===name)){alert('同じ大項目名があります');return}g.name=name;saveCategorySettings()}\nfunction moveMajor(i,delta){let target=i+delta;if(target<0||target>=db.categoryGroups.length)return;let groups=db.categoryGroups;[groups[i],groups[target]]=[groups[target],groups[i]];saveCategorySettings()}\nfunction deleteMajor(i){let g=db.categoryGroups[i];if(g.categories.length){alert('この大項目には費目が登録されています。先に費目を別の大項目へ移動または削除してください。');return}if(!confirm('大項目「'+g.name+'」を削除しますか？'))return;db.categoryGroups.splice(i,1);saveCategorySettings()}\nfunction addCategory(i){let g=db.categoryGroups[i],name=prompt('「'+g.name+'」に追加する費目名');if(!name||!name.trim())return;name=name.trim();if(allCategories().includes(name)){alert('同じ費目名がすでにあります');return}g.categories.push(name);g.categories.sort((a,b)=>a.localeCompare(b,'ja'));saveCategorySettings()}\nfunction renameCategory(gi,ci){let old=db.categoryGroups[gi].categories[ci],name=prompt('費目名を変更',old);if(!name||!name.trim()||name.trim()===old)return;name=name.trim();if(allCategories().includes(name)){alert('同じ費目名がすでにあります');return}db.categoryGroups[gi].categories[ci]=name;Object.values(db.months).forEach(m=>{(m.transactions||[]).forEach(x=>{if(x.category===old)x.category=name});(m.budgets||[]).forEach(x=>{if(x.category===old)x.category=name})});saveCategorySettings()}\nfunction moveCategory(gi,ci){let name=db.categoryGroups[gi].categories[ci],choices=db.categoryGroups.map((g,i)=>(i+1)+'. '+g.name).join('\\n'),answer=prompt('「'+name+'」の移動先の番号を入力してください。\\n'+choices,String(gi+1));if(answer===null)return;let target=Number(answer)-1;if(!Number.isInteger(target)||target<0||target>=db.categoryGroups.length){alert('番号が正しくありません');return}if(target===gi)return;db.categoryGroups[gi].categories.splice(ci,1);db.categoryGroups[target].categories.push(name);db.categoryGroups[target].categories.sort((a,b)=>a.localeCompare(b,'ja'));saveCategorySettings()}\nfunction deleteCategory(gi,ci){let name=db.categoryGroups[gi].categories[ci],used=Object.values(db.months).some(m=>(m.transactions||[]).some(x=>x.category===name)||(m.budgets||[]).some(x=>x.category===name));if(used){alert('この費目は取引履歴または予算で使用中のため削除できません。名称変更するか、取引・予算を整理してから削除してください。');return}if(!confirm('費目「'+name+'」を削除しますか？'))return;db.categoryGroups[gi].categories.splice(ci,1);saveCategorySettings()}\ndocument.getElementById('addMajor').addEventListener('click',function(e){e.preventDefault();addMajor()});\nfunction shiftMonth(delta){let [y,m]=current.split('-').map(Number),d=new Date(y,m-1+delta,1);let key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');if(!db.months[key]){let prev=data();db.months[key]={month:key,transactions:[],budgets:JSON.parse(JSON.stringify(prev.budgets)),accounts:JSON.parse(JSON.stringify(prev.accounts))}}current=key;persist()}\ndocument.getElementById('prev').onclick=()=>shiftMonth(-1);document.getElementById('next').onclick=()=>shiftMonth(1);\ndocument.getElementById('month').onchange=e=>{let key=e.target.value;if(!key)return;if(!db.months[key]){let prev=data();db.months[key]={month:key,transactions:[],budgets:JSON.parse(JSON.stringify(prev.budgets)),accounts:JSON.parse(JSON.stringify(prev.accounts))}}current=key;persist()};\ndocument.getElementById('filter').oninput=render;\ndocument.getElementById('backup').onclick=()=>{let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='家計簿バックアップ_'+current+'.json';a.click();URL.revokeObjectURL(a.href)};\ndocument.getElementById('restore').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let v=JSON.parse(r.result);if(!v.months)throw 0;if(confirm('現在のデータにバックアップを読み込みますか？')){db=v;current=Object.keys(db.months).sort().slice(-1)[0];persist()}}catch(_){alert('バックアップファイルを読み込めませんでした')}};r.readAsText(f)};\ndocument.getElementById('date').value=new Date().toISOString().slice(0,10);render();\n<\/script><\/body><\/html>","point":"<!doctype html>\n<html lang=\"ja\"><head><script>try{window.claude=window.parent.claude}catch(e){}<\/script><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><meta name=\"theme-color\" content=\"#173d66\"><title>MUFGポイント管理<\/title>\n<style>\n:root{--navy:#173d66;--blue:#2468a6;--pale:#edf4fb;--ink:#1d2935;--muted:#687789;--line:#dce4ec;--green:#16845b;--gold:#b7791f;--bg:#f4f7fa}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",sans-serif}header{background:linear-gradient(120deg,#173d66,#286da8);color:white;padding:22px 16px 20px}header .wrap,main{max-width:980px;margin:auto}h1{font-size:22px;margin:0 0 5px}header p{margin:0;color:#dceafa;font-size:13px}.tabs{display:flex;gap:8px;margin:14px 0 0}.tab{border:1px solid #ffffff66;color:white;background:#ffffff18;border-radius:20px;padding:8px 14px;font-size:13px}.tab.active{background:white;color:var(--navy);font-weight:700}main{padding:16px 12px 40px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 3px 12px #203b5710}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.topline h2{font-size:17px;margin:0}.monthnav{display:flex;align-items:center;gap:8px}.monthnav button,.btn{border:1px solid var(--line);background:white;border-radius:10px;padding:9px 12px;color:var(--ink);font-size:14px}.monthnav input{border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.metric{background:var(--pale);border-radius:12px;padding:12px}.metric small{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;font-size:20px;margin-top:5px;color:var(--navy);font-variant-numeric:tabular-nums}.metric.emph{background:#e8f6ef}.metric.emph strong{color:var(--green)}.tablewrap{overflow-x:auto;margin-top:12px}table{width:100%;border-collapse:collapse;min-width:560px}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;font-size:13px}th{background:#f7f9fc;color:#526274;font-weight:600}th:first-child,td:first-child{text-align:left}td input{width:100%;min-width:90px;padding:9px 8px;border:1px solid var(--line);border-radius:8px;text-align:right;font:inherit;font-variant-numeric:tabular-nums}td input:focus{outline:2px solid #9fc5e8;border-color:var(--blue)}.rategrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.field input{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;font:inherit}.hint{color:var(--muted);font-size:12px;line-height:1.6;margin:10px 0 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.primary{background:var(--navy);color:white;border-color:var(--navy)}.danger{color:#b42318}.section{display:none}.section.active{display:block}.summaryrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.summaryrow strong{font-variant-numeric:tabular-nums}.pill{display:inline-block;background:#edf4fb;color:#245d91;border-radius:20px;padding:4px 8px;font-size:11px}.monthlist{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.monthitem{border:1px solid var(--line);border-radius:10px;padding:10px;background:white;text-align:left}.monthitem b{display:block;color:var(--navy);font-size:13px}.monthitem span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.foot{font-size:11px;color:var(--muted);text-align:center;padding:8px}\n@media(max-width:600px){header{padding:18px 14px}h1{font-size:20px}main{padding:12px 10px 30px}.panel{padding:13px;border-radius:13px}.cards{gap:7px}.metric{padding:10px 8px}.metric strong{font-size:17px}.rategrid{grid-template-columns:repeat(2,1fr)}.monthlist{grid-template-columns:repeat(2,1fr)}}\n<\/style><\/head><body>\n<header><div class=\"wrap\"><h1>MUFGポイント管理<\/h1><p>利用金額の入力・還元ポイントの自動計算<\/p><div class=\"tabs\"><button class=\"tab active\" data-tab=\"input\">入力・計算<\/button><button class=\"tab\" data-tab=\"history\">月別一覧<\/button><button class=\"tab\" data-tab=\"settings\">設定・バックアップ<\/button><\/div><\/div><\/header>\n<main>\n<section id=\"input\" class=\"section active\">\n<div class=\"panel\"><div class=\"topline\"><h2>対象月<\/h2><div class=\"monthnav\"><button id=\"prev\">‹<\/button><input type=\"month\" id=\"month\"><button id=\"next\">›<\/button><\/div><\/div>\n<div class=\"cards\"><div class=\"metric\"><small>利用合計<\/small><strong id=\"spendTotal\">¥0<\/strong><\/div><div class=\"metric\"><small>獲得ポイント<\/small><strong id=\"pointTotal\">0 pt<\/strong><\/div><div class=\"metric\"><small>ポイント換算対象額<\/small><strong id=\"eligible\">¥0<\/strong><\/div><div class=\"metric emph\"><small>翌月支給予定ポイント<\/small><strong id=\"actualAward\">0 pt<\/strong><\/div><\/div><p class=\"hint\">対象月の利用分に対して翌月に支給されるポイントです（Excel V列の計算式を参考）。<\/p><\/div>\n<div class=\"panel\"><div class=\"topline\"><h2>利用金額<\/h2><span class=\"pill\">金額を入力すると自動計算<\/span><\/div>\n<div class=\"tablewrap\"><table><thead><tr><th>利用区分<\/th><th>利用金額（円）<\/th><th>計算対象<\/th><\/tr><\/thead><tbody>\n<tr><td>OK（通常対象）<\/td><td><input id=\"ok\" type=\"number\" min=\"0\" step=\"1\" inputmode=\"numeric\" placeholder=\"0\"><\/td><td>50,000円上限<\/td><\/tr>\n<tr><td>セブン<\/td><td><input id=\"seven\" type=\"number\" min=\"0\" step=\"1\" inputmode=\"numeric\" placeholder=\"0\"><\/td><td rowspan=\"2\">合算50,000円上限<\/td><\/tr>\n<tr><td>その他<\/td><td><input id=\"other\" type=\"number\" min=\"0\" step=\"1\" inputmode=\"numeric\" placeholder=\"0\"><\/td><\/tr>\n<tr><td>対象外<\/td><td><input id=\"excluded\" type=\"number\" min=\"0\" step=\"1\" inputmode=\"numeric\" placeholder=\"0\"><\/td><td>ポイント対象外<\/td><\/tr>\n<\/tbody><\/table><\/div><p class=\"hint\">「対象外」は利用合計には含まれますが、還元ポイントの計算には含めません。<\/p><\/div>\n<div class=\"panel\"><h2 style=\"font-size:17px;margin:0\">還元率・計算結果<\/h2><div class=\"rategrid\">\n<div class=\"field\"><label>基本還元率（%）<\/label><input id=\"baseRate\" type=\"number\" min=\"0\" max=\"100\" step=\".1\"><\/div>\n<div class=\"field\"><label>OK還元率（%）<\/label><input id=\"okRate\" type=\"number\" min=\"0\" max=\"100\" step=\".1\"><\/div>\n<div class=\"field\"><label>セブン還元率（%）<\/label><input id=\"sevenRate\" type=\"number\" min=\"0\" max=\"100\" step=\".1\"><\/div>\n<div class=\"field\"><label>その他還元率（%）<\/label><input id=\"otherRate\" type=\"number\" min=\"0\" max=\"100\" step=\".1\"><\/div>\n<div class=\"field\"><label>Plus10還元率（%）<\/label><input id=\"extraRate\" type=\"number\" min=\"0\" max=\"100\" step=\".1\"><\/div>\n\n<div class=\"field\"><label>個別還元上限（円）<\/label><input id=\"bonusCap\" type=\"number\" min=\"0\" step=\"1000\"><\/div>\n<\/div><p class=\"hint\">Excelの「MUFGポイント」シートにある計算の考え方をもとに、1,000円未満切り捨て・上限額を反映します。月ごとに還元率は変更できます。<\/p>\n<div class=\"tablewrap\"><table><thead><tr><th>ポイント内訳<\/th><th>対象金額<\/th><th>還元額<\/th><th>ポイント<\/th><\/tr><\/thead><tbody id=\"resultRows\"><\/tbody><\/table><\/div>\n<div class=\"actions\"><button class=\"btn primary\" id=\"save\">この月の内容を保存<\/button><button class=\"btn\" id=\"clear\">この月をクリア<\/button><\/div><p class=\"hint\" id=\"savedMsg\">入力内容は端末内に自動保存されます。<\/p><\/div>\n<\/section>\n<section id=\"history\" class=\"section\"><div class=\"panel\"><div class=\"topline\"><h2>月別ポイント一覧<\/h2><span class=\"pill\">保存済みデータ<\/span><\/div><div id=\"historyList\" style=\"margin-top:12px\"><\/div><\/div><\/section>\n<section id=\"settings\" class=\"section\"><div class=\"panel\"><h2 style=\"font-size:17px;margin:0 0 8px\">データ管理<\/h2><p class=\"hint\">データはこのブラウザ内に保存されます。機種変更やブラウザ変更の前にバックアップしてください。<\/p><div class=\"actions\"><button class=\"btn primary\" id=\"export\">バックアップを書き出す<\/button><label class=\"btn\" for=\"importFile\">バックアップを読み込む<\/label><input id=\"importFile\" type=\"file\" accept=\"application/json\" hidden><\/div><\/div><div class=\"panel\"><h2 style=\"font-size:17px;margin:0 0 8px\">家計簿データを反映<\/h2><p class=\"hint\">家計簿バックアップに実際に存在する各月の「支出」かつ支払方法が「MUFGカード」の取引だけを翌月へ反映します。バックアップに存在しない月のポイント管理データは変更しません。「店名・メモ」にOKを含むものはOK、「セブン」を含むものはセブン、それ以外は対象外に分類します。その他の金額は手動入力分を維持します。再反映時はOK・セブン・対象外の金額を置き換えます。<\/p><div class=\"actions\"><label class=\"btn primary\" for=\"kakeiboImport\">家計簿バックアップを選択<\/label><input id=\"kakeiboImport\" type=\"file\" accept=\".json,application/json\" hidden><\/div><p class=\"hint\" id=\"kakeiboImportStatus\">まだ反映していません。<\/p><\/div><div class=\"panel\"><h2 style=\"font-size:17px;margin:0 0 8px\">計算について<\/h2><p class=\"hint\">Plus10は「基本ポイント × Plus10還元率」を計算し、小数点以下を切り捨てます。Excelに合わせてPlus10還元率は初期値10%とし、月ごとに変更できます。実際のMUFGカードの適用条件・ポイント付与条件はカード種別やキャンペーンによって異なる場合があります。Excelの式と実際の付与結果を確認しながら、還元率を調整してください。<\/p><\/div><\/section>\n<div class=\"foot\">MUFGポイント管理アプリ・端末内保存<\/div>\n<\/main>\n<script>\nconst KEY='mufgPointManager_v1';\nconst $=id=>document.getElementById(id);\nconst yen=n=>'¥'+Math.round(n||0).toLocaleString('ja-JP');\nconst num=id=>Math.max(0,Number($(id).value)||0);\nconst defaults=()=>({baseRate:.5,okRate:6.5,sevenRate:6.5,otherRate:6.5,extraRate:10,bonusCap:50000,ok:0,seven:0,other:0,excluded:0});\nlet db={months:{}}, current=new Date().toISOString().slice(0,7);\ntry{db=JSON.parse(localStorage.getItem(KEY))||db}catch(e){}\nif(!db.months)db={months:{}};\nfor(const v of Object.values(db.months)){if(v && v.extraRate===8)v.extraRate=10;}\nfunction getMonth(){return db.months[current]||defaults()}\nfunction persist(){localStorage.setItem(KEY,JSON.stringify(db))}\nfunction setFields(v){['ok','seven','other','excluded','baseRate','okRate','sevenRate','otherRate','extraRate','bonusCap'].forEach(k=>$(k).value=v[k]??defaults()[k]);calc()}\nfunction values(){let v={};['ok','seven','other','excluded','baseRate','okRate','sevenRate','otherRate','extraRate','bonusCap'].forEach(k=>v[k]=Number($(k).value)||0);return v}\nfunction floor1000(n){return Math.floor(Math.max(0,n)/1000)*1000}\nfunction compute(v){\n const total=v.ok+v.seven+v.other+v.excluded, eligible=v.ok+v.seven+v.other;\n const baseAmount=floor1000(total);\n const baseYen=baseAmount*v.baseRate/100, basePts=baseYen/5;\n const okAmount=Math.min(floor1000(v.ok),v.bonusCap);\n const subSum=v.seven+v.other, subAllowed=subSum>=v.bonusCap?0:1;\n const sevenAmount=subAllowed?Math.min(floor1000(v.seven),v.bonusCap):0;\n const otherAmount=subAllowed?Math.min(floor1000(v.other),v.bonusCap):0;\n const okYen=okAmount*v.okRate/100, sevenYen=sevenAmount*v.sevenRate/100, otherYen=otherAmount*v.otherRate/100;\n const bonusPoints=Math.floor(okYen/5)+Math.floor(sevenYen/5)+Math.floor(otherYen/5);\n const campaignPoints=Math.floor(basePts*v.extraRate/100);\n const points=basePts+bonusPoints+campaignPoints;\n return {...v,total,eligible,baseAmount,baseYen,basePts,okAmount,sevenAmount,otherAmount,okYen,sevenYen,otherYen,bonusPoints,campaignPoints,points};\n}\nfunction monthOffset(key,delta){let [y,m]=key.split('-').map(Number);let d=new Date(y,m-1+delta,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}\nfunction calc(){\n const result=compute(values());\n const older=db.months[monthOffset(current,-2)];\n const olderBonus=older?compute({...defaults(),...older}).bonusPoints:0;\n const actualAward=result.basePts+result.campaignPoints+olderBonus;\n $('spendTotal').textContent=yen(result.total);$('pointTotal').textContent=result.points.toLocaleString('ja-JP',{maximumFractionDigits:2})+' pt';$('eligible').textContent=yen(result.eligible);\n $('actualAward').textContent=actualAward.toLocaleString('ja-JP',{maximumFractionDigits:2})+' pt';\n $('resultRows').innerHTML=[\n ['基本ポイント',result.baseAmount,result.baseYen,result.basePts],\n ['OK追加ポイント',result.okAmount,result.okYen,Math.floor(result.okYen/5)],\n ['セブン追加ポイント',result.sevenAmount,result.sevenYen,Math.floor(result.sevenYen/5)],\n ['その他追加ポイント',result.otherAmount,result.otherYen,Math.floor(result.otherYen/5)],\n ['Plus10（基本ポイントの'+result.extraRate+'%）',result.basePts,result.campaignPoints,result.campaignPoints],\n ['合計',result.eligible,result.baseYen+result.okYen+result.sevenYen+result.otherYen,result.points]\n ].map((r,i)=>`<tr${i===5?' style=\"font-weight:700;background:#edf4fb\"':''}><td>${r[0]}<\/td><td>${i===4?Number(r[1]).toLocaleString('ja-JP',{maximumFractionDigits:2})+' pt':yen(r[1])}<\/td><td>${i===4?Number(r[2]).toLocaleString('ja-JP')+' pt':yen(r[2])}<\/td><td>${r[3].toLocaleString('ja-JP',{maximumFractionDigits:2})} pt<\/td><\/tr>`).join('');\n return {...result,actualAward};\n}\nfunction save(silent=false){db.months[current]=calc();persist();$('savedMsg').textContent='保存しました（'+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})+'）';renderHistory()}\nfunction load(){ $('month').value=current;setFields(getMonth())}\nfunction moveMonth(d){let [y,m]=current.split('-').map(Number);let x=new Date(y,m-1+d,1);current=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');load()}\nfunction renderHistory(){\n const keys=Object.keys(db.months).sort().reverse();\n if(!keys.length){$('historyList').innerHTML='<p class=\"hint\">まだ保存された月別データはありません。<\/p>';return}\n $('historyList').innerHTML='<div class=\"monthlist\">'+keys.map(k=>{let v=db.months[k],p=v.points??0,t=v.total??((v.ok||0)+(v.seven||0)+(v.other||0)+(v.excluded||0));return `<button class=\"monthitem\" data-month=\"${k}\"><b>${k}<\/b><span>利用 ${yen(t)} ／ ${p.toLocaleString('ja-JP')} pt<\/span><\/button>`}).join('')+'<\/div>';\n document.querySelectorAll('[data-month]').forEach(b=>b.onclick=()=>{current=b.dataset.month;load();document.querySelector('[data-tab=\"input\"]').click()})\n}\ndocument.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.section').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab));if(b.dataset.tab==='history')renderHistory()});\n$('prev').onclick=()=>moveMonth(-1);$('next').onclick=()=>moveMonth(1);$('month').onchange=e=>{current=e.target.value||current;load()};\n['ok','seven','other','excluded','baseRate','okRate','sevenRate','otherRate','extraRate','bonusCap'].forEach(k=>$(k).addEventListener('input',()=>{calc();db.months[current]=calc();persist();renderHistory()}));\n$('save').onclick=()=>save();$('clear').onclick=()=>{if(confirm('この月の入力内容をクリアしますか？')){db.months[current]=defaults();persist();load();$('savedMsg').textContent='この月をクリアしました。'}};\n$('export').onclick=()=>{let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='MUFGポイント_backup.json';a.click();URL.revokeObjectURL(a.href)};\n$('importFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.months)throw 0;if(confirm('現在のデータをバックアップ内容で置き換えますか？')){db=x;persist();load();renderHistory();alert('読み込みました')}}catch(_){alert('バックアップを読み込めませんでした')}};r.readAsText(f);e.target.value=''};\n$('kakeiboImport').onchange=e=>{\n const f=e.target.files[0];if(!f)return;\n const reader=new FileReader();\n reader.onload=()=>{\n  try{\n   const source=JSON.parse(reader.result);\n   if(!source||!source.months||typeof source.months!=='object')throw new Error('家計簿の月別データが見つかりません');\n   const nextMonth=month=>{\n    const [y,m]=month.split('-').map(Number),d=new Date(y,m,1);\n    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');\n   };\n   const sourceMonths=Object.keys(source.months)\n    .filter(month=>/^\\d{4}-\\d{2}$/.test(month)&&Array.isArray(source.months[month]?.transactions))\n    .sort();\n   if(!sourceMonths.length)throw new Error('反映できる月別の取引データが見つかりません');\n   const candidates=sourceMonths.map(sourceMonth=>{\n    const targetMonth=nextMonth(sourceMonth);\n    const matched=source.months[sourceMonth].transactions.filter(tx=>tx&&tx.type==='expense'&&String(tx.method||'').trim()==='MUFGカード');\n    const totals={ok:0,seven:0,excluded:0},counts={ok:0,seven:0,excluded:0};\n    matched.forEach(tx=>{\n     const memo=String(tx.memo||'');\n     const key=memo.toLowerCase().includes('ok')?'ok':memo.includes('セブン')?'seven':'excluded';\n     totals[key]+=Number(tx.amount)||0;counts[key]++;\n    });\n    return {sourceMonth,targetMonth,matched:matched.length,totals,counts};\n   });\n   // MUFGカードの支出が1件以上ある月だけを反映対象にする\n   const imports=candidates.filter(x=>x.matched>0);\n   const noCardMonths=candidates.filter(x=>x.matched===0).map(x=>x.sourceMonth);\n   if(!imports.length){\n    alert('バックアップ内にMUFGカードの支出がある月がありません。\\nポイント管理のデータは変更していません。');\n    return;\n   }\n   const summary=imports.map(x=>`${x.sourceMonth} → ${x.targetMonth}：MUFGカード ${x.matched}件／OK ${x.counts.ok}件 ${yen(x.totals.ok)}／セブン ${x.counts.seven}件 ${yen(x.totals.seven)}／対象外 ${x.counts.excluded}件 ${yen(x.totals.excluded)}`).join('\\n');\n   const skippedText=noCardMonths.length?`\\n\\nMUFGカード0件のため取り込まない月：${noCardMonths.join('、')}`:'';\n   if(!confirm(`MUFGカードの支出が1件以上ある月だけを翌月へ反映します。\\n\\n${summary}${skippedText}\\n\\n0件の月およびバックアップに存在しない月のデータは変更しません。反映先のOK・セブン・対象外は集計値に置き換え、「その他」は現在の金額を維持します。\\n\\nよろしいですか？`))return;\n   imports.forEach(item=>{\n    const existing={...defaults(),...(db.months[item.targetMonth]||{})};\n    existing.ok=item.totals.ok;existing.seven=item.totals.seven;existing.excluded=item.totals.excluded;\n    db.months[item.targetMonth]=existing;\n   });\n   current=imports[imports.length-1].targetMonth;\n   persist();load();renderHistory();\n   const status=$('kakeiboImportStatus');\n   if(status)status.textContent=`反映済み：MUFGカードの支出が1件以上あった${imports.length}か月分のみ翌月へ反映。0件の月と元データのない月は変更していません。`;\n   document.querySelector('[data-tab=\"input\"]')?.click();\n   alert(`MUFGカードの支出が1件以上あった${imports.length}か月分を翌月へ反映しました。\\n${imports[0].sourceMonth} → ${imports[0].targetMonth}\\n～ ${imports[imports.length-1].sourceMonth} → ${imports[imports.length-1].targetMonth}\\n\\nMUFGカード0件の月およびバックアップに存在しない月のデータは変更していません。\\n各月の「その他」も維持しています。`);\n  }catch(err){alert(err.message||'家計簿バックアップを読み込めませんでした。')}\n  finally{e.target.value=''}\n };\n reader.readAsText(f);\n};\nload();renderHistory();\n<\/script><\/body><\/html>","asset":"<!doctype html>\n<html lang=\"ja\"><head><script>try{window.claude=window.parent.claude}catch(e){}<\/script><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-title\" content=\"資産\">\n<meta name=\"theme-color\" content=\"#0f766e\">\n<title>資産管理<\/title>\n<style>\n:root{--bg:#f3f5f7;--card:#fff;--tx:#14181f;--mu:#6b7280;--ln:#e5e7eb;--ac:#0f766e;--up:#15803d;--dn:#dc2626;--tab:rgba(255,255,255,.94);color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0p
